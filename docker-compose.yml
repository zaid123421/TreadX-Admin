# VPS: copy .env.example → .env in the same directory as this file, then:
#   docker compose up -d --build

services:
  treadx-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_ENABLE_API_DEBUG: ${VITE_ENABLE_API_DEBUG:-false}
        VITE_AUTH_REFRESH_403_CODES: ${VITE_AUTH_REFRESH_403_CODES:-TOKEN_EXPIRED,INVALID_TOKEN}
    image: treadx-admin:latest
    container_name: treadx-admin
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-9000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
